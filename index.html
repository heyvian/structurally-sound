const Q=(prompt,opts,answer,explain,hint='')=>({prompt,opts,answer,explain,hint,type:'choice'});const N=(prompt,answer,explain,hint='',unit='')=>({prompt,answer,explain,hint,unit,type:'number'});
const units=[
{title:'Acting loads on buildings',date:'Sep 10 · Foundations',intro:'Loads are actions on a structure. A load path carries them through structural elements to the ground.',notes:['Dead load: permanent self-weight.','Live load: variable occupancy and movable contents.','Wind and seismic effects can produce lateral actions.','Trace load paths from roof and floor to foundation.'],q:[Q('Which is typically a dead load?',['Concrete slab','People in a classroom','Snow on a roof'],0,'The permanent slab contributes its own weight.'),Q('What ultimately receives the building’s gravity loads?',['The facade','The ground','The ceiling'],1,'Loads must travel through a continuous path to the ground.'),N('A floor has a uniform load of 4 kN/m² over 20 m². Total load in kN?',80,'4 × 20 = 80 kN.','Multiply load intensity by area.','kN')]},
{title:'Static fundamentals & forces',date:'Sep 17 · Quiz 1',intro:'Forces are vectors. Resolve them into perpendicular components using SOH CAH TOA. If the angle is measured from +x, Fx = F cos θ and Fy = F sin θ.',notes:['SOH CAH TOA','Fx = F cos θ; Fy = F sin θ (angle from x)','Resultant = √(Fx² + Fy²)','Use degrees and consistent signs.'],q:[Q('Which ratio equals sine?',['Adjacent / hypotenuse','Opposite / hypotenuse','Opposite / adjacent'],1,'SOH: sine = opposite / hypotenuse.'),N('A 10 kN force acts at 30° above +x. Find Fy.',5,'10 sin 30° = 5 kN.','The vertical component is opposite the angle.','kN'),N('Find the magnitude of a resultant with components 3 and 4 kN.',5,'√(3² + 4²) = 5 kN.','Use Pythagoras.','kN')]},
{title:'Equilibrium & free-body diagrams',date:'Sep 24 · Quiz 2',intro:'Isolate the body, replace supports with reactions, and show all external loads. In planar static equilibrium, ΣFx = ΣFy = ΣM = 0.',notes:['Pin: horizontal and vertical reactions.','Roller on horizontal surface: vertical reaction.','Fixed support: horizontal, vertical and moment reactions.','ΣFx = ΣFy = ΣM = 0.'],q:[Q('Which reactions does an ideal planar pin provide?',['Vertical only','Horizontal and vertical','Horizontal, vertical and moment'],1,'A pin allows rotation but prevents translation.'),Q('Which belongs on an isolated beam free-body diagram?',['Only applied loads','Applied loads and support reactions','Only internal stresses'],1,'Show all external forces and moments.'),N('A 12 kN downward force is balanced by one vertical reaction. Magnitude?',12,'ΣFy = 0 gives an upward 12 kN reaction.','Upward balances downward.','kN')]},
{title:'Moments & reaction forces',date:'Oct 1 · Quiz 3',intro:'A moment is a force times its perpendicular lever arm. Taking moments about a support removes unknown reactions at that point from the moment equation.',notes:['M = F × perpendicular distance','Choose a consistent rotational sign.','Take moments about a convenient support.','Check both force and moment equilibrium.'],q:[N('A 6 kN force acts perpendicular to a 2 m lever. Moment magnitude?',12,'6 × 2 = 12 kN·m.','Force times perpendicular distance.','kN·m'),N('A 6 m simply supported beam has a 12 kN point load 2 m from A. Find vertical reaction B.',4,'Taking moments about A: B × 6 = 12 × 2, so B = 4 kN.','Take moments about A.','kN'),N('For the same beam, find vertical reaction A.',8,'A + 4 − 12 = 0, giving A = 8 kN.','Use vertical equilibrium.','kN')]},
{title:'Shear & moment diagrams',date:'Oct 8 · Quiz 4',intro:'Shear describes internal transverse force; bending moment describes internal rotational effect. With the convention used here, dM/dx = V. A point load changes shear abruptly.',notes:['Point load → jump in shear.','Constant shear → linear moment.','Uniform distributed load → linear shear, quadratic moment.','Simple end supports: zero end moment absent applied end couples.'],q:[Q('Between point loads with no distributed load, shear is…',['Constant','Parabolic','Always zero'],0,'No distributed load means no change in shear.'),{type:'draw',prompt:'Construct the shear diagram for a 6 m simply supported beam with a central 12 kN downward load.',answer:[6,6,-6,-6],explain:'Reactions are +6 kN each. Shear is +6 before midspan and −6 after it.',hint:'The point load creates a 12 kN downward jump.',kind:'shear'}, {type:'draw',prompt:'Construct the bending moment diagram for the same beam. Positive sagging is plotted upward here.',answer:[0,18,0],explain:'Moment rises linearly to 6 × 3 = 18 kN·m at midspan, then falls to zero.',hint:'The moment diagram slopes according to shear.',kind:'moment'}]},
{title:'Section properties & material capacity',date:'Oct 15 · Quiz 5',intro:'Stress is force per area; strain is relative deformation. The initial slope of an idealized stress–strain curve is elastic modulus E.',notes:['σ = F/A','ε = ΔL/L','E = σ/ε in linear elastic range.','Yielding is the onset of permanent deformation.'],q:[N('A 20,000 N axial force acts on 100 mm². Stress in MPa?',200,'20,000 / 100 = 200 N/mm² = 200 MPa.','Divide force by area.','MPa'),{type:'stress',prompt:'Select the approximate yield point on this idealized ductile steel stress–strain curve.',answer:1,explain:'Yield marks the onset of significant plastic deformation. The plotted curve is schematic.',hint:'Look near the end of the initial elastic rise.'},Q('What does the initial stress–strain slope represent?',['Density','Elastic modulus','Ultimate strength'],1,'Elastic modulus describes stiffness in the linear elastic range.')]},
{title:'Centre of gravity & moment of inertia',date:'Oct 22 · Quiz 6',intro:'The centroid is an area-weighted location. The second moment of area describes how area is distributed about an axis, influencing bending stiffness.',notes:['ȳ = ΣAy / ΣA','Rectangle: Ix = bh³/12 about centroid.','Parallel axis: I = Ic + Ad².','Check axis and units (mm⁴).'],q:[N('A rectangle is 20 mm wide and 30 mm deep. Find centroidal Ix in mm⁴.',45000,'20 × 30³ / 12 = 45,000 mm⁴.','Cube the depth, not the width.','mm⁴'),{type:'table',prompt:'Required Ix ≥ 80 × 10⁶ mm⁴. Select the lightest illustrative section satisfying this criterion alone.',opts:['A','B','C'],answer:1,explain:'B is the lightest candidate meeting the stated inertia. Real selection also requires other strength, stability and serviceability checks.',hint:'Eliminate insufficient Ix, then compare mass.'},N('Two areas of 10 and 30 mm² have centroid heights 0 and 20 mm. Combined centroid height?',15,'(10×0 + 30×20)/40 = 15 mm.','Use an area-weighted average.','mm')]},
{title:'Buckling',date:'Oct 29 · Quiz 7',intro:'Slender compression members can become unstable. Ideal Euler buckling load Pcr = π²EI/(KL)².',notes:['Pcr = π²EI/(KL)² for ideal elastic buckling.','Larger effective length reduces capacity.','Use the relevant weak-axis inertia.'],q:[Q('If effective length doubles, ideal Euler load becomes…',['Twice as large','One half','One quarter'],2,'The effective length is squared in the denominator.'),Q('Which member is generally more susceptible to buckling, all else equal?',['Long slender column','Short stocky column'],0,'Slenderness increases instability risk.'),Q('Which section property appears in Euler’s formula?',['Second moment of area','Volume','Mass'],0,'EI governs flexural stiffness.')]},
{title:'Truss analysis',date:'Nov 19 · Quiz 8',intro:'Ideal pin-jointed truss members carry axial tension or compression. Start with whole-truss reactions, then isolate joints or sections.',notes:['Ideal truss: pin joints, loads applied at joints.','Method of joints: ΣFx = 0, ΣFy = 0.','Assumed tension pulls away from a joint; negative result indicates compression.','Method of sections: use equilibrium of a cut portion.'],q:[Q('Ideal truss members primarily carry…',['Axial tension or compression','Bending only','Torsion only'],0,'Ideal pin-jointed members are two-force members.'),N('At an isolated joint, a member at 30° must supply 5 kN upward. Find its axial force magnitude.',10,'F sin 30° = 5, giving F = 10 kN.','Resolve the member force vertically.','kN'),Q('You assumed tension and calculated −8 kN. What is the actual state?',['8 kN tension','8 kN compression','Zero force'],1,'A negative result reverses the assumed direction.')]},
{title:'Truss analysis & course review',date:'Nov 26 · Quiz 9',intro:'Integrate load paths, equilibrium, section properties and truss behavior. Start by identifying the structural model, then choose equations.',notes:['Draw a free-body diagram first.','Resolve forces, calculate reactions, then internal forces.','Keep units and signs consistent.','Check equilibrium and the physical plausibility of results.'],q:[Q('Before solving a truss joint, what is often useful to determine?',['Support reactions','Paint colour','Elastic strain in every member'],0,'Whole-structure equilibrium provides the external reactions.'),N('A symmetric simply supported truss carries a central 24 kN vertical load. Each vertical reaction?',12,'Symmetry and vertical equilibrium give 12 kN each.','Divide the central load equally.','kN')]}
];

'For a 100 mm² bar carrying 10,000 N, σ=100 MPa. A 200 mm bar extending 0.2 mm has ε=0.001. On the elastic portion, the slope E relates stress to strain; yielding is the start of significant permanent deformation.',
'Divide a section into rectangles and locate each centroid. Compute the area-weighted centroid and then sum b h³/12 + A d² for the horizontal axis. For bending capacity, S=I/c and required S=M/σallow (convert kN·m to N·mm first).',
'For ideal equal columns, doubling effective length divides Euler load by four. The shorter member may remain stable under a load that buckles the longer one. This is a preview until lectures arrive.',
'Start with whole-truss support reactions. Isolate a joint with no more than two unknown member forces. Assume tension, and resolve angled members using trig. A negative answer indicates compression; update the arrows and carry those forces to the next joint.',

function initGraph(q){graphValues=q.stations.map(()=>null);graphShapes=q.curve.map(()=>null);picked=null;let r=analyze(q.b),max=Math.max(...q.answer.map(Math.abs));let range=Math.max(5,Math.ceil(max/5)*5);let el=document.getElementById('graphPlot'),fields=document.getElementById('graphFields');let select=0;let x=t=>48+424*t/q.b.L;let y=v=>130+(q.kind==='M'?1:-1)*v/range*95;let exact=v=>v==null?'':fmt(v);function paint(solution=false){let base=Array.from({length:9},(_,i)=>range-(range/4)*i).map(v=>`<path d="M48 ${y(v)}H472" stroke="${Math.abs(v)<1e-9?'#52645e':'#d4ddd5'}" stroke-width="${Math.abs(v)<1e-9?2:1}"/><text x="4" y="${y(v)+4}" font-size="10">${fmt(v)}</text>`).join('');base+=q.stations.map(p=>`<path d="M${x(p.x)} 27V233" stroke="#c8d3ca"/>`).join('');let pth=(values,shapes,sol=false)=>{let d='';values.forEach((v,i)=>{if(v==null)return;let p=q.stations[i];if(i===0||values[i-1]==null){d+=`M${x(p.x)} ${y(v)}`;return}let prev=q.stations[i-1],pv=values[i-1];if(q.kind==='M'&&shapes[i-1]==='curve'){let mid=(p.x+prev.x)/2;let control=sol?2*r.M(mid)-(pv+v)/2:(pv+v)/2+range*.12;d+=`Q${x(mid)} ${y(control)} ${x(p.x)} ${y(v)}`}else d+=`L${x(p.x)} ${y(v)}`});return d};el.innerHTML=base+`<text x="48" y="15" font-size="11">${q.kind==='M'?'M (kN·m), + down':'V (kN), + up'}</text><path d="M${x(q.stations[select].x)} 24V236" stroke="#bd8035" stroke-width="2" stroke-dasharray="5 4"/><path d="${pth(graphValues,graphShapes)}" fill="none" stroke="#217b60" stroke-width="3"/>`+graphValues.map((v,i)=>v==null?'':`<circle cx="${x(q.stations[i].x)}" cy="${y(v)}" r="4" fill="#217b60"/>`).join('')+(solution?`<path d="${pth(q.answer,q.curve,true)}" fill="none" stroke="#c44e3d" stroke-width="3" stroke-dasharray="6 3"/><text x="470" y="252" text-anchor="end" font-size="10" fill="#a33a25">DASHED = SOLUTION</text>`:'');}
